<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker">
    <h2 align="center">Expense Tracker</h2>
    <input type="text" id="name" placeholder="Expense Name">
    <input type="number" id="amount" placeholder="Amount($)">
    <button id="add-expense">Add Expense</button>

    <div id="display-area">
        <p align="center" style="color:rgb(29, 44, 56);"><b>ORDER RECIEPT :</b> </p>
        <ul id="expense-list"></ul>
        <h3 id="tot">Total: $<span id="total-val">0</span></h3>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
